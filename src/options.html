<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SharePoint Office Launcher settings</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 24px;line-height:1.45}
    label{display:block;font-weight:600;margin-top:18px} input,select{box-sizing:border-box;width:100%;padding:9px;margin-top:5px} input[type=checkbox]{width:auto;margin-right:8px}
    button{margin-top:22px;padding:10px 16px}.hint{color:#555;font-size:.92rem}.status{margin-left:12px}
  </style>
</head>
<body>
  <h1>SharePoint Office Launcher</h1>
  <p class="hint">These local settings are for POC/testing. Enterprise managed policy overrides them.</p>
  <label>SharePoint origin<input id="origin" placeholder="https://workspace.example.gov.au"></label>
  <p class="hint">Origin only: scheme + hostname + optional port. No path.</p>
  <label>Allowed path prefix<input id="path" value="/"></label>
  <label>Open mode<select id="mode"><option value="edit">Edit</option><option value="view">View</option></select></label>
  <label><input id="resolve" type="checkbox" checked>Attempt Doc.aspx sourcedoc GUID resolution</label>
  <label><input id="debug" type="checkbox">Debug logging</label>
  <label><input id="enabled" type="checkbox" checked>Enabled</label>
  <button id="save">Save</button><span class="status" id="status"></span>
  <script src="options.js"></script>
</body>
</html>
